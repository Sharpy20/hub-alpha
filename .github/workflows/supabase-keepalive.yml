name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily (07:00 UK)
  workflow_dispatch:      # lets you trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_SERVICE_KEY secret"
            exit 1
          fi
          # Real SELECT against feedback_posts so this counts as DB activity.
          # GET /rest/v1/ alone only hits the API gateway and does NOT reset
          # Supabase's free-tier inactivity timer.
          response=$(curl -sS -w "\n%{http_code}" "$SUPABASE_URL/rest/v1/feedback_posts?select=id&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY")
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase returned HTTP $status"
            echo "$body"
            exit 1
          fi
          echo "Hub Supabase keep-alive: queried feedback_posts (HTTP $status)"
